services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - [setFramework, ['@contao.framework']]

    ErdmannFreunde\ContaoStatusUpdateBundle\:
        resource: '../src/'
        exclude:
            - '../src/{DependencyInjection,Model}'
            - '../src/ErdmannFreundeContaoStatusUpdateBundle.php'
